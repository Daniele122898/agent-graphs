[project]
name = "agent-graphs"
version = "0.1.0"
description = "A local multi-agent software team that lives in a repo folder"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=0.0.40",
    "httpx>=0.27",
    "anyio>=4.4",
    "pyyaml>=6.0",        # config.yml (API keys / provider endpoints)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "playwright>=1.40",        # browser-driven UI verification (scripts/verify_ui.py)
    "pytest-playwright>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
